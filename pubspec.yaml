name: bunbungo
description: "A new Flutter project."

publish_to: 'none'

# BunBunGo versioning:
# Format: MAJOR.MINOR.PATCH+BUILD_NUMBER (e.g. 1.0.0+1)
# - MAJOR.MINOR.PATCH maps to Android versionName and iOS CFBundleShortVersionString.
# - BUILD_NUMBER maps to Android versionCode and iOS CFBundleVersion.
# You can also use: dart run tool/version.dart (show | bump build | bump patch | bump minor | bump major)
version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  riverpod: ^3.5.0
  isar_community: ^3.4.1
  flutter_mobx: ^2.4.0
  animations: ^3.0.0
  flutter_native_splash: ^2.4.8
  freezed_annotation: ^3.1.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.6
  flutter_riverpod: ^3.5.0
  mobx: ^2.7.0
  fl_chart: ^1.3.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^4.0.3
  isar_community_generator: ^3.4.1
  mobx_codegen: ^2.7.8

flutter:

  uses-material-design: true

